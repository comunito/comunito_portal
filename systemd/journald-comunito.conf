[Journal]
# Se conserva un journal acotado para poder diagnosticar reinicios y cortes.
# La cuota evita crecimiento ilimitado y el servicio de diagnósticos registra
# únicamente una muestra por minuto, no cada lectura ALPR.
Storage=persistent
SystemMaxUse=32M
SystemKeepFree=128M
RuntimeMaxUse=16M
RuntimeKeepFree=32M
RateLimitIntervalSec=30s
RateLimitBurst=200
Compress=yes
